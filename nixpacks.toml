[providers]
providers = ['php', 'node']

[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --optimize-autoloader --no-dev',
  'npm install',
  'npm run build',
  'chmod -R 777 storage bootstrap/cache'
]

[start]
cmd = "chmod -R 777 storage bootstrap/cache && php -S 0.0.0.0:$PORT -t public"
