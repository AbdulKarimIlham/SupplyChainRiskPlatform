[providers]
providers = ['php', 'node']

[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --optimize-autoloader --no-dev',
  'npm install',
  'npm run build'
]

[start]
cmd = 'php artisan migrate --force || true && php artisan db:seed --force || true && php -S 0.0.0.0:$PORT -t public'
